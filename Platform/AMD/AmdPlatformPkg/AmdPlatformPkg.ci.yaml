    "DebugMacroCheck": {
      "StringSubstitutions": {
          # Reason: Expansion of macro that contains a print specifier.
          # AMD can write its own print specifier.
          # "AMD_PRINT": "0x%lx"
      }
    },
    "CodeQlAnalyze": {
        "AuditOnly": False,          # Fail the build if there are errors.
        "QuerySpecifiers": "",       # Query specifiers to pass to CodeQL CLI.
        "Filters": [                 # Inclusion/exclusion filters
            "-**/MdePkg/**/*",               # outside the scope of this package
            "-**/MdeModulePkg/**/*",         # outside the scope of this package
            "-**/SecurityPkg/**/*",          # outside the scope of this package
            "-**/CryptoPkg/**/*",            # outside the scope of this package
            "-**/PcdValueInit/**/*",         # From Build directory, Build/AmdPlatformPkg/DEBUG_GCC/PcdValueInit/PcdValueInit.c
            "-**/UnitTestFrameworkPkg/**/*"  # third-party test framework (cmocka, googletest); not in scope
        ]
    }
}
